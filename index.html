<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tetris Neon</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <h1>CYBER TETRIS</h1>

    <div class="container">
        <!-- Tablero principal -->
        <div style="position: relative;">
            <div class="game-board" id="board"></div>
            <div id="game-over">
                <h2>SYSTEM FAIL</h2>
                <button class="btn-neon" onclick="resetGame()">RELOAD</button>
            </div>
        </div>

        <!-- Panel lateral -->
        <div class="side-panel">
            <div class="panel-box">
                <h2>NEXT</h2>
                <div id="next-canvas"></div>
            </div>

            <div class="panel-box">
                <h2>SCORE</h2>
                <p id="score">0</p>
            </div>

            <div class="panel-box">
                <h2>LEVEL</h2>
                <p id="level">1</p>
            </div>

            <button class="btn-neon" id="start-btn" onclick="startGame()">START</button>
        </div>
    </div>

    <div class="controls-hint">
        CONTROLS: ← → MOVE | ↑ ROTATE | ↓ SOFT DROP | SPACE HARD DROP
    </div>
    <script src="scripts.js"></script>
</body>

</html>
